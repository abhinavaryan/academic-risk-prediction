<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI/ML Research Project - Student Early Risk Prediction</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl text-center">
            <h1 class="text-3xl font-black text-indigo-400 mb-2">🎓 Early Student Academic Risk Prediction</h1>
            <p class="text-slate-400 text-sm">B.Tech Minor Project | Powered by Real OULAD Dataset & Random Forest Classifier</p>
        </div>

        <!-- Prediction Form -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-xl font-bold text-indigo-400 mb-4">⚙️ Test Student Data Live Prediction</h2>
            
            <form action="/predict" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Gender</label>
                    <select name="gender" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg">
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Region</label>
                    <input type="text" name="region" value="East Region" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Highest Education</label>
                    <input type="text" name="highest_education" value="A Level or Equivalent" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">IMD Band</label>
                    <input type="text" name="imd_band" value="20-30%" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Age Band</label>
                    <input type="text" name="age_band" value="0-35" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Previous Attempts</label>
                    <input type="number" name="num_of_prev_attempts" value="0" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Studied Credits</label>
                    <input type="number" name="studied_credits" value="60" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Disability</label>
                    <select name="disability" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg">
                        <option value="N">No</option>
                        <option value="Y">Yes</option>
                    </select>
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl transition cursor-pointer">
                        Run Prediction with Real Model
                    </button>
                </div>
            </form>

            {% if prediction %}
            <div class="mt-6 p-4 rounded-xl border {% if is_safe %}bg-emerald-950/40 border-emerald-500 text-emerald-300{% else %}bg-rose-950/40 border-rose-500 text-rose-300{% endif %} text-center">
                <h3 class="text-lg font-bold">Prediction Result: {{ prediction }}</h3>
                <p class="text-xs mt-1">Model Confidence Probability: <strong>{{ confidence }}</strong></p>
            </div>
            {% endif %}
        </div>

    </div>
</body>
</html>
